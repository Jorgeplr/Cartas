server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los assets llevan hash en el nombre (index-a1b2c3.js): si cambia el
  # contenido cambia el nombre, asi que cachearlos para siempre es seguro.
  # El =404 es a proposito: si falta uno, que se vea como error y no como
  # el index.html disfrazado de JavaScript, que falla de formas raras.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html NUNCA se cachea: es quien dice que assets cargar. Sin esta
  # cabecera el navegador se queda con una copia vieja y sigue abriendo la
  # version anterior de la app durante horas, aunque el deploy ya trajo la
  # nueva. Es la causa clasica de "desplegue pero sigo viendo lo de antes".
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
